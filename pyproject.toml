[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb3dgs"
version = "0.1.0"
description = "Reproducibility utilities for WB-3DGS"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<1.12",
  "scikit-learn>=1.3,<1.4",
  "pandas>=2.1,<2.2",
  "PyYAML>=6,<7",
  "opencv-python>=4.8,<4.9",
  "Pillow>=10,<11",
  "scikit-image>=0.22,<0.23",
]

[tool.setuptools.packages.find]
include = ["wb3dgs*"]

