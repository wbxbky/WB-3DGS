experiment: table3_optimization_heldout_lidar
base_config: ../paper_defaults.yaml
wind_regimes: [L1, L2, L3]
sequences_per_regime: 6
reference: optimization_heldout_deskewed_lidar_sweep
methods: [3DGS, Deformable-GS, Dynamic-3D-Gaussians, 4DGS, WB-3DGS]
